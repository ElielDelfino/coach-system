services:

  # ─────────────────────────────────────────
  # BANCO DE DADOS — imagem pública, manager only
  # ─────────────────────────────────────────
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coach_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager        # fixo no manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ─────────────────────────────────────────
  # CACHE — imagem pública, manager only
  # ─────────────────────────────────────────
  cache:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - coach_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager        # fixo no manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ─────────────────────────────────────────
  # BACK-END — replicável, workers
  # ─────────────────────────────────────────
  backend:
    image: coach-backend:latest
    volumes:
      - /home/elieldelfino/coach-system/docs:/app/docs:ro       # build com docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: https://${DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    networks:
      - coach_network
    depends_on:
      - database
      - cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2                     # escala horizontal
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first            # zero downtime deploy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ─────────────────────────────────────────
  # FRONT-END — replicável, workers
  # ─────────────────────────────────────────
  frontend:
    image: coach-frontend:latest
    ports:
     - "80:80"      # build com docker/frontend.Dockerfile
    networks:
      - coach_network
    deploy:
      replicas: 2                     # escala horizontal
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first            # zero downtime deploy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

# ─────────────────────────────────────────
# VOLUMES persistentes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ─────────────────────────────────────────
# REDE interna do Swarm (overlay)
# ─────────────────────────────────────────
networks:
  coach_network:
    driver: overlay
    attachable: true