server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ────────────────────────────────────────────────────────
  # CSP: permite scripts/estilos próprios, imagens e vídeos do S3, iframes do YouTube.
  # 'unsafe-inline' em style-src é necessário para o @dnd-kit (inline transforms).
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.s3.amazonaws.com https://*.s3.*.amazonaws.com; media-src 'self' https://*.s3.amazonaws.com https://*.s3.*.amazonaws.com; frame-src https://www.youtube.com https://youtube.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    always;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    # ─── LOCAL (Docker Compose / Swarm) ───────────────────────────────────────
    proxy_pass http://backend:3000/api/;
    # ─── EASYPANEL — descomente a linha abaixo e comente a de cima ────────────
    # resolver 127.0.0.11 valid=10s ipv6=off;
    # set $backend http://<PROJETO>_backend:80;   # troque <PROJETO> pelo nome do projeto no EasyPanel
    # proxy_pass $backend;
    # ─────────────────────────────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_header Set-Cookie;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
